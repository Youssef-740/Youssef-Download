name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q youssef-download-v1.0.9-modified.zip
          cp -r ezoo-download-main/. .
          mv .github/workflows/build.yml build.yml
          rm -rf ezoo-download-main youssef-download-v1.0.9-modified.zip
          git config user.name "bot"
          git config user.email "bot@example.com"
          git add -A
          git commit -m "unzip"
          git push
